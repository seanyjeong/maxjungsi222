<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>가채점 · 맥스정시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <link rel="stylesheet" href="gachaejeom.css">
</head>
<body data-page="gachaejeom" data-title="가채점" data-category="최종 지원">
  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>
    <div class="main">
      <header class="topbar">
        <div class="page-path">
          <span>최종 지원</span><span class="sep">/</span><span class="current">가채점</span>
        </div>
        <div class="topbar-actions">
          <div class="combobox no-search topbar-combo" id="yearCombo" data-width="100"></div>
          <div class="combobox no-search topbar-combo" id="examCombo" data-width="110"></div>
          <button class="btn btn-ghost" id="reloadBtn" title="새로고침">
            <i class="ph-light ph-arrows-clockwise"></i>
            <span>새로고침</span>
          </button>
          <button class="btn btn-ghost" id="recalcBtn" title="최신 등급컷으로 재계산">
            <i class="ph-light ph-magic-wand"></i>
            <span>최신 기준 업데이트</span>
          </button>
          <button class="btn btn-primary" id="saveBtn" disabled>
            <i class="ph-fill ph-check-circle"></i>
            <span>전체 저장 및 변환</span>
          </button>
        </div>
      </header>

      <section class="page-content">

        <!-- 요약 카드 4장 -->
        <div class="summary-row">
          <div class="summary-card">
            <div class="summary-label">전체 학생</div>
            <div class="summary-value"><span id="statTotal">—</span><span class="unit">명</span></div>
          </div>
          <div class="summary-card accent">
            <div class="summary-label">입력 완료 <span class="sub">(가채점)</span></div>
            <div class="summary-value"><span id="statFilled">—</span><span class="unit">명</span><span class="pct" id="statPct"></span></div>
          </div>
          <div class="summary-card">
            <div class="summary-label">미입력</div>
            <div class="summary-value"><span id="statEmpty">—</span><span class="unit">명</span></div>
          </div>
          <div class="summary-card warn" id="dirtyCard">
            <div class="summary-label">변경된 행</div>
            <div class="summary-value"><span id="statDirty">0</span><span class="unit">건</span></div>
          </div>
        </div>

        <!-- 안내 배너 -->
        <div class="hint-banner">
          <i class="ph-light ph-info"></i>
          <span>원점수 입력 시 예상 <b>표준·백분위·등급</b>이 자동 변환됩니다 (영어·한국사는 등급만).</span>
          <span class="dot">·</span>
          <span><b>2학년은 고2 기준</b>을 자동 적용합니다.</span>
          <span class="dot">·</span>
          <span><b>변경된 행</b>만 저장됩니다.</span>
        </div>

        <!-- 메인 테이블 (score_input 스타일 그대로, 원점수 컬럼만 추가) -->
        <div class="table-wrap">
          <table id="scoreTable" class="score-table">
            <colgroup>
              <col class="c-name"><col class="c-info"><col class="c-info-sm">
              <col class="c-raw"><col class="c-grade">
              <col class="c-subj"><col class="c-raw"><col class="c-std"><col class="c-perc"><col class="c-grade">
              <col class="c-subj"><col class="c-raw"><col class="c-std"><col class="c-perc"><col class="c-grade">
              <col class="c-raw"><col class="c-grade">
              <col class="c-subj"><col class="c-raw"><col class="c-std"><col class="c-perc"><col class="c-grade">
              <col class="c-subj"><col class="c-raw"><col class="c-std"><col class="c-perc"><col class="c-grade">
            </colgroup>
            <thead>
              <tr class="head-1">
                <th rowspan="2">이름</th>
                <th rowspan="2">학년</th>
                <th rowspan="2">성별</th>
                <th colspan="2" class="grp hist">한국사</th>
                <th colspan="5" class="grp kor">국어</th>
                <th colspan="5" class="grp math">수학</th>
                <th colspan="2" class="grp eng">영어</th>
                <th colspan="5" class="grp t1">탐구 1</th>
                <th colspan="5" class="grp t2">탐구 2</th>
              </tr>
              <tr class="head-2">
                <th class="subj-first">원점수</th><th>등급</th>
                <th class="subj-first">선택</th><th>원점수</th><th>표준</th><th>백분위</th><th>등급</th>
                <th class="subj-first">선택</th><th>원점수</th><th>표준</th><th>백분위</th><th>등급</th>
                <th class="subj-first">원점수</th><th>등급</th>
                <th class="subj-first">선택</th><th>원점수</th><th>표준</th><th>백분위</th><th>등급</th>
                <th class="subj-first">선택</th><th>원점수</th><th>표준</th><th>백분위</th><th>등급</th>
              </tr>
            </thead>
            <tbody id="scoreTbody">
              <tr><td colspan="27" style="text-align:center;padding:40px;color:var(--text-3);">학생 목록을 불러오는 중…</td></tr>
            </tbody>
          </table>
        </div>

      </section>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="assets/js/combobox.js"></script>
  <script src="utils/examProfiles.js?v=20260903-3"></script>
  <script src="utils/examSchedule.js"></script>
  <script src="utils/gachaCohort.js?v=20260903-3"></script>
  <script src="gachaejeom.js?v=20260903-3"></script>
</body>
</html>
