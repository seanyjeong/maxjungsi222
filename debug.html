<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>디버그 노트 · 맥스정시</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <!-- 공통 자산 -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <!-- 페이지 전용 -->
  <link rel="stylesheet" href="debug.css">
</head>
<body data-page="debug" data-title="디버그 노트" data-category="관리자">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>관리자</span>
          <span class="sep">/</span>
          <span class="current">디버그 노트</span>
        </div>
        <div class="topbar-actions">
          <div class="combobox no-search topbar-combo" id="yearSel" style="min-width:130px;"></div>
          <button class="btn btn-primary" id="runBtn">
            <i class="ph-light ph-play-circle"></i> 디버깅 시작
          </button>
        </div>
      </header>

      <section class="page-content">

        <!-- 설명 + 필터 -->
        <div class="intro-card">
          <div class="intro-head">
            <div class="intro-title">
              <i class="ph-light ph-bug"></i>
              <span>정시 계산 엔진 디버거</span>
            </div>
            <p class="intro-sub">
              규칙이 들어간 학교들만 한 번에 계산해서 맞는지 표시하고 메모를 남깁니다.
              <b>디버깅 시작</b> 버튼을 눌러 실행하세요.
            </p>
          </div>
          <div class="filter-bar" id="filterBar">
            <button class="fbtn active" data-filter="all">
              <i class="ph-light ph-list-bullets"></i> 전체 <span class="count" id="count-all">0</span>
            </button>
            <button class="fbtn" data-filter="Y">
              <i class="ph-light ph-check-circle"></i> 맞음 <span class="count" id="count-Y">0</span>
            </button>
            <button class="fbtn" data-filter="N">
              <i class="ph-light ph-x-circle"></i> 틀림 <span class="count" id="count-N">0</span>
            </button>
            <button class="fbtn" data-filter="?">
              <i class="ph-light ph-question"></i> 미확인 <span class="count" id="count-unk">0</span>
            </button>
          </div>
        </div>

        <div class="status-bar" id="statusBar" hidden>
          <i class="ph-fill ph-info"></i>
          <span id="statusText">—</span>
        </div>

        <div id="resultsContainer" class="results-grid">
          <div class="empty-state">
            <i class="ph-light ph-play-circle"></i>
            <h3><b>디버깅 시작</b> 버튼을 눌러 규칙을 로드하세요</h3>
            <p>학년도를 바꾸면 해당 연도의 규칙 저장 학교들이 대상입니다.</p>
          </div>
        </div>

      </section>
    </div>
  </div>

  <!-- 공통 JS -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="assets/js/combobox.js"></script>
  <!-- 페이지 전용 -->
  <script src="debug.js"></script>
</body>
</html>
