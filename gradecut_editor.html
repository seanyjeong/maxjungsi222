<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>등급컷 편집 · 맥스정시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- 공통 자산 -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <link rel="stylesheet" href="gradecut_editor.css">
</head>
<body data-page="gradecut_editor" data-title="등급컷 편집" data-category="관리자">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>관리자</span>
          <span class="sep">/</span>
          <span class="current">등급컷 편집</span>
        </div>
        <div class="topbar-actions">
          <span class="role-pill"><i class="ph-light ph-map-pin"></i><strong id="branchName">—</strong></span>
        </div>
      </header>

      <section class="page-content">

        <!-- 안내 배너 -->
        <div class="hint-banner">
          <i class="ph-fill ph-sliders-horizontal"></i>
          <span>학년도 · 모형 · 과목을 선택한 뒤 <b>불러오기</b> 로 기존 데이터를 편집하거나, 직접 값을 입력해 <b>전체 저장</b> 하세요. 엑셀에서 범위 복사 후 표에 <b>붙여넣기(Ctrl+V)</b> 하면 자동으로 채워집니다.</span>
        </div>

        <!-- 설정 카드 -->
        <form id="gradecut-form">
          <div class="config-card">
            <div class="config-grid">
              <div class="field">
                <label for="year-select">학년도</label>
                <select id="year-select" name="year">
                  <option value="2027">2027</option>
                  <option value="2026">2026</option>
                  <option value="2028">2028</option>
                </select>
              </div>
              <div class="field">
                <label for="exam-type-select">모형</label>
                <select id="exam-type-select" name="exam_type">
                  <option value="수능">수능</option>
                  <option value="9월">9월 모의평가</option>
                  <option value="6월">6월 모의평가</option>
                  <option value="3월">3월 모의평가</option>
                </select>
              </div>
              <div class="field">
                <label for="subject-select">선택과목</label>
                <select id="subject-select" name="subject" required>
                  <option value="">-- 과목 선택 --</option>
                </select>
              </div>
              <div class="field field-btn">
                <label>&nbsp;</label>
                <button type="button" id="load-cuts-btn" class="btn btn-ghost">
                  <i class="ph-light ph-download-simple"></i> 불러오기
                </button>
              </div>
            </div>
          </div>

          <!-- 테이블 카드 -->
          <div class="table-card">
            <header class="card-head">
              <div class="card-title-group">
                <h2 class="card-title">등급컷 데이터 입력</h2>
                <p class="card-sub">만점 + 1~9 등급별 원점수 · 표준점수 · 백분위</p>
              </div>
            </header>

            <div class="table-wrap">
              <table id="fixed-cuts-table" class="cuts-table">
                <thead>
                  <tr>
                    <th class="th-grade">구분</th>
                    <th>원점수</th>
                    <th>표준점수</th>
                    <th>백분위</th>
                  </tr>
                </thead>
                <tbody>
                  <tr data-grade="1" data-type="max">
                    <th class="th-grade"><span class="grade-chip grade-max">만점</span></th>
                    <td><input type="number" name="raw_max" class="cut-input" required></td>
                    <td><input type="number" name="std_max" class="cut-input" required></td>
                    <td><input type="number" name="pct_max" class="cut-input" required min="0" max="100"></td>
                  </tr>
                  <tr data-grade="1" data-type="cutoff">
                    <th class="th-grade"><span class="grade-chip grade-1">1등급</span></th>
                    <td><input type="number" name="raw_1" class="cut-input" required></td>
                    <td><input type="number" name="std_1" class="cut-input" required></td>
                    <td><input type="number" name="pct_1" class="cut-input" required min="0" max="100"></td>
                  </tr>
                  <tr data-grade="2" data-type="cutoff">
                    <th class="th-grade"><span class="grade-chip grade-2">2등급</span></th>
                    <td><input type="number" name="raw_2" class="cut-input" required></td>
                    <td><input type="number" name="std_2" class="cut-input" required></td>
                    <td><input type="number" name="pct_2" class="cut-input" required min="0" max="100"></td>
                  </tr>
                  <tr data-grade="3" data-type="cutoff">
                    <th class="th-grade"><span class="grade-chip grade-3">3등급</span></th>
                    <td><input type="number" name="raw_3" class="cut-input" required></td>
                    <td><input type="number" name="std_3" class="cut-input" required></td>
                    <td><input type="number" name="pct_3" class="cut-input" required min="0" max="100"></td>
                  </tr>
                  <tr data-grade="4" data-type="cutoff">
                    <th class="th-grade"><span class="grade-chip grade-4">4등급</span></th>
                    <td><input type="number" name="raw_4" class="cut-input" required></td>
                    <td><input type="number" name="std_4" class="cut-input" required></td>
                    <td><input type="number" name="pct_4" class="cut-input" required min="0" max="100"></td>
                  </tr>
                  <tr data-grade="5" data-type="cutoff">
                    <th class="th-grade"><span class="grade-chip grade-5">5등급</span></th>
                    <td><input type="number" name="raw_5" class="cut-input" required></td>
                    <td><input type="number" name="std_5" class="cut-input" required></td>
                    <td><input type="number" name="pct_5" class="cut-input" required min="0" max="100"></td>
                  </tr>
                  <tr data-grade="6" data-type="cutoff">
                    <th class="th-grade"><span class="grade-chip grade-6">6등급</span></th>
                    <td><input type="number" name="raw_6" class="cut-input" required></td>
                    <td><input type="number" name="std_6" class="cut-input" required></td>
                    <td><input type="number" name="pct_6" class="cut-input" required min="0" max="100"></td>
                  </tr>
                  <tr data-grade="7" data-type="cutoff">
                    <th class="th-grade"><span class="grade-chip grade-7">7등급</span></th>
                    <td><input type="number" name="raw_7" class="cut-input" required></td>
                    <td><input type="number" name="std_7" class="cut-input" required></td>
                    <td><input type="number" name="pct_7" class="cut-input" required min="0" max="100"></td>
                  </tr>
                  <tr data-grade="8" data-type="cutoff">
                    <th class="th-grade"><span class="grade-chip grade-8">8등급</span></th>
                    <td><input type="number" name="raw_8" class="cut-input" required></td>
                    <td><input type="number" name="std_8" class="cut-input" required></td>
                    <td><input type="number" name="pct_8" class="cut-input" required min="0" max="100"></td>
                  </tr>
                  <tr data-grade="9" data-type="cutoff">
                    <th class="th-grade"><span class="grade-chip grade-9">9등급</span></th>
                    <td><input type="number" name="raw_9" value="0" class="cut-input" required></td>
                    <td><input type="number" name="std_9" class="cut-input" required></td>
                    <td><input type="number" name="pct_9" value="0" class="cut-input" required min="0" max="100"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="form-footer">
              <p id="message" class="message" role="status" aria-live="polite"></p>
              <button type="submit" class="btn btn-primary save-btn">
                <i class="ph-light ph-floppy-disk"></i> 전체 저장
              </button>
            </div>
          </div>
        </form>

      </section>
    </div>
  </div>

  <!-- 공통 JS -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="utils/examProfiles.js?v=20260903-3"></script>
  <!-- 페이지 전용 -->
  <script src="gradecut_editor.js?v=20260903-3"></script>
</body>
</html>
