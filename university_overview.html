<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대학 정보 · 모집요강 · 맥스정시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- 공통 자산 -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <!-- 페이지 전용 -->
  <link rel="stylesheet" href="university_overview.css">
</head>
<body data-page="university_overview" data-title="대학 정보" data-category="인사이트">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>조회 · 상담</span>
          <span class="sep">/</span>
          <span class="current">대학 정보 · 모집요강</span>
        </div>
        <div class="topbar-actions">
          <div class="combobox no-search topbar-combo" id="yearSel"></div>
        </div>
      </header>

      <section class="page-content">

        <!-- 요약 카운터 -->
        <div class="summary-row">
          <div class="summary-card accent">
            <div class="lbl">전체 학과</div>
            <div class="val" id="sumTotal">—</div>
            <div class="sub"><span id="sumYear">2027</span>학년도 정시</div>
          </div>
          <div class="summary-card">
            <div class="lbl">군별 분포</div>
            <div class="val" id="sumGun" style="font-size:16px">—</div>
            <div class="sub">모집군 기준</div>
          </div>
          <div class="summary-card">
            <div class="lbl">교직 가능</div>
            <div class="val" id="sumTeach">—</div>
            <div class="sub" id="sumTeachSub">—</div>
          </div>
          <div class="summary-card">
            <div class="lbl">총 모집 인원</div>
            <div class="val" id="sumSeats">—</div>
            <div class="sub">명</div>
          </div>
        </div>

        <!-- 필터 바 -->
        <div class="filter-bar">
          <div class="gun-buttons" id="gunButtons">
            <button class="gun-btn active" data-gun="all">전체</button>
            <button class="gun-btn" data-gun="가">가군</button>
            <button class="gun-btn" data-gun="나">나군</button>
            <button class="gun-btn" data-gun="다">다군</button>
          </div>
          <div class="search-box">
            <i class="ph-light ph-magnifying-glass"></i>
            <input type="search" id="searchInput" placeholder="대학, 학과, 지역 검색…">
          </div>
          <button class="filter-adv-btn" id="advToggle">
            <i class="ph-light ph-sliders-horizontal"></i>
            상세 필터
            <span class="count" id="advCount" style="display:none">0</span>
          </button>
          <div class="combobox no-search sort-combo" id="sortSel"></div>
          <div class="result-count" id="resultCount">— / 총 —</div>
        </div>

        <!-- 상세 필터 패널 -->
        <div class="filter-panel" id="advPanel">
          <div class="filter-group filter-group-wide">
            <div class="filter-group-label">지역</div>
            <div class="check-row" data-filter="region" id="regionChips">
              <!-- JS 가 schools 응답의 unique 광역 값으로 자동 생성 -->
            </div>
          </div>
          <div class="filter-group">
            <div class="filter-group-label">반영 제외 과목 (이 과목 반영 학교 숨김)</div>
            <div class="check-row" data-filter="excludeSubj">
              <span class="check-chip" data-v="국어">국어</span>
              <span class="check-chip" data-v="수학">수학</span>
              <span class="check-chip" data-v="영어">영어</span>
              <span class="check-chip" data-v="탐구">탐구</span>
            </div>
          </div>
          <div class="filter-group">
            <div class="filter-group-label">교직</div>
            <div class="check-row" data-filter="teach">
              <span class="check-chip" data-v="O">가능 (O)</span>
              <span class="check-chip" data-v="△">일부 (△)</span>
              <span class="check-chip" data-v="X">불가능 (X)</span>
            </div>
          </div>
          <div class="filter-group">
            <div class="filter-group-label">내신 반영</div>
            <div class="check-row" data-filter="naesin">
              <span class="check-chip" data-v="yes">반영</span>
              <span class="check-chip" data-v="no">미반영</span>
            </div>
          </div>
        </div>

        <!-- 테이블 -->
        <div class="univ-table-wrap">
          <table class="univ-table">
            <colgroup>
              <col style="width:50px">                <!-- 군 -->
              <col style="width:88px">                <!-- 지역 -->
              <col style="width:180px">               <!-- 대학/학과 -->
              <col style="width:50px">                <!-- 교직 -->
              <col style="width:60px">                <!-- 모집 -->
              <col style="width:56px">                <!-- 수능 -->
              <col style="width:56px">                <!-- 내신 -->
              <col style="width:56px">                <!-- 실기 -->
              <col style="width:56px">                <!-- 1단계 -->
              <col style="width:320px">               <!-- 반영 과목 -->
              <col>                                    <!-- 실기 종목 (남은 공간 흡수) -->
            </colgroup>
            <thead>
              <tr>
                <th class="col-gun">군</th>
                <th class="col-region">지역</th>
                <th class="col-univ">대학 / 학과</th>
                <th>교직</th>
                <th>모집</th>
                <th>수능</th>
                <th>내신</th>
                <th>실기</th>
                <th>1단계</th>
                <th class="col-subj">반영 과목</th>
                <th class="col-silgi">실기 종목</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="13"><div class="empty-state"><i class="ph-light ph-circle-notch spin"></i><h3>불러오는 중…</h3></div></td></tr>
            </tbody>
          </table>
        </div>

      </section>
    </div>
  </div>

  <!-- 상세 모달 -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <div class="title" id="mdTitle">—</div>
          <div class="sub" id="mdSub">—</div>
          <div class="meta-chips" id="mdChips"></div>
        </div>
        <button class="close-btn" id="mdClose" aria-label="닫기"><i class="ph-light ph-x" style="font-size:20px"></i></button>
      </div>
      <div class="modal-body">

        <div class="detail-section">
          <div class="detail-section-title">수능 반영 과목</div>
          <div class="subj-grid" id="mdSubjGrid"></div>
        </div>

        <div class="detail-section">
          <div class="detail-section-title-row">
            <div class="detail-section-title">실기 배점표</div>
            <div class="gender-toggle" id="mdGenderToggle">
              <button class="gender-btn active" data-gender="남">남</button>
              <button class="gender-btn" data-gender="여">여</button>
            </div>
          </div>
          <table class="silgi-table">
            <thead><tr><th>종목</th><th>만점 기록</th><th>만점 점수</th><th>1감당 감점</th></tr></thead>
            <tbody id="mdSilgiTbody"></tbody>
          </table>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">과거 컷 히스토리</div>
          <div class="cut-history" id="mdCuts"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- 공통 JS -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="assets/js/combobox.js"></script>
  <script src="assets/js/silgi-hardcode.js"></script>
  <!-- 페이지 전용 -->
  <script src="university_overview.js"></script>
</body>
</html>
