<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>성적 분포 · 등급 통계 · 맥스정시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- 공통 자산 -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <!-- 페이지 전용 -->
  <link rel="stylesheet" href="grade_distribution.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body data-page="grade_distribution" data-title="성적 분포 · 등급 통계" data-category="조회 · 상담">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>조회 · 상담</span>
          <span class="sep">/</span>
          <span class="current">성적 분포 · 등급 통계</span>
        </div>
        <div class="topbar-actions">
          <div class="combobox no-search topbar-combo" id="examSel"></div>
          <div class="combobox no-search topbar-combo" id="yearSel"></div>
        </div>
      </header>

      <section class="page-content">

        <!-- 요약 카운터 -->
        <div class="summary-row">
          <div class="summary-card accent">
            <div class="lbl">전국 응시 학생</div>
            <div class="val" id="sumTotal">—</div>
            <div class="sub"><span id="sumYear">2027</span>학년도 · <span id="sumExam">3월</span> · 맥스 등록 기준</div>
          </div>
          <div class="summary-card">
            <div class="lbl">현재 보기</div>
            <div class="val" id="sumCurrent" style="font-size:18px">—</div>
            <div class="sub" id="sumCurrentSub">과목을 선택하세요</div>
          </div>
          <div class="summary-card">
            <div class="lbl">상위 등급 (1~3)</div>
            <div class="val" id="sumTop">—</div>
            <div class="sub" id="sumTopSub">— %</div>
          </div>
          <div class="summary-card">
            <div class="lbl">평균 등급</div>
            <div class="val" id="sumAvg">—</div>
            <div class="sub">선택 과목 응시자 기준</div>
          </div>
        </div>

        <!-- 카테고리 탭 -->
        <div class="cat-tabs" id="catTabs">
          <button class="cat-tab active" data-cat="국어"><i class="ph-light ph-book-open-text"></i><span>국어</span></button>
          <button class="cat-tab" data-cat="수학"><i class="ph-light ph-function"></i><span>수학</span></button>
          <button class="cat-tab" data-cat="영어"><i class="ph-light ph-translate"></i><span>영어</span></button>
          <button class="cat-tab" data-cat="한국사"><i class="ph-light ph-scroll"></i><span>한국사</span></button>
          <button class="cat-tab" data-cat="사회탐구"><i class="ph-light ph-globe-hemisphere-east"></i><span>사회탐구</span></button>
          <button class="cat-tab" data-cat="과학탐구"><i class="ph-light ph-atom"></i><span>과학탐구</span></button>
        </div>

        <!-- 과목 chip 행 -->
        <div class="subj-chips" id="subjChips"></div>

        <!-- 차트 + 분포 표 -->
        <div class="chart-grid">
          <div class="chart-card">
            <div class="chart-head">
              <div class="chart-title" id="chartTitle">—</div>
              <div class="chart-legend">
                <span class="lg lg-good"><i></i>1~3등급</span>
                <span class="lg lg-mid"><i></i>4~5등급</span>
                <span class="lg lg-low"><i></i>6~9등급</span>
              </div>
            </div>
            <div class="chart-canvas-wrap">
              <canvas id="gradeChart"></canvas>
              <div class="chart-empty" id="chartEmpty"><i class="ph-light ph-chart-bar"></i><span>데이터 없음</span></div>
            </div>
          </div>

          <aside class="dist-table-card">
            <div class="dist-head">등급별 분포</div>
            <table class="dist-table" id="distTable">
              <thead><tr><th>등급</th><th>인원</th><th>비율</th></tr></thead>
              <tbody></tbody>
              <tfoot><tr><td>합계</td><td id="distFootCount">—</td><td>100%</td></tr></tfoot>
            </table>
          </aside>
        </div>

      </section>
    </div>
  </div>

  <!-- 공통 JS -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="assets/js/combobox.js"></script>
  <!-- counsel 과 공유: 모형 시행일 기반 디폴트 자동 선택 -->
  <script src="utils/examSchedule.js"></script>
  <!-- 페이지 전용 -->
  <script src="grade_distribution.js"></script>
</body>
</html>
