<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>실기 에디터 · 맥스정시</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <!-- 공통 자산 -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <!-- 페이지 전용 -->
  <link rel="stylesheet" href="silgi-editor.css?v=20260906">
</head>
<body data-page="silgi_editor" data-title="실기 에디터" data-category="관리자">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>관리자</span>
          <span class="sep">/</span>
          <span class="current">실기 에디터</span>
        </div>
        <div class="topbar-actions">
          <div class="combobox no-search topbar-combo" id="yearSel" style="min-width:130px;"></div>
        </div>
      </header>

      <section class="page-content">

        <!-- 상단 컨트롤 바 (학교 선택) -->
        <div class="control-card">
          <div class="control-head">
            <div class="control-title">
              <i class="ph-light ph-barbell"></i>
              <span>실기 배점표 관리</span>
            </div>
            <div class="control-sub">학년도와 학교를 선택한 뒤 <b>배점표 불러오기</b></div>
          </div>
          <div class="control-row">
            <label class="field-label" for="schoolSearch">학교 · 학과</label>
            <div class="combobox" id="schoolSearch" style="flex:1;min-width:320px;"></div>
            <button class="btn btn-primary" id="loadButton">
              <i class="ph-light ph-download-simple"></i> 배점표 불러오기
            </button>
          </div>
        </div>

        <!-- 배점표 공통 헤더 -->
        <div class="table-meta-bar">
          <h2 class="table-title" id="tableTitle">배점표 <span class="dim">(U_ID: —)</span></h2>
          <div class="table-meta" id="tableMeta"></div>
        </div>

        <div class="practical-edit-bar">
          <div><p class="note">종목명은 해당 종목의 남녀 배점표에 함께 적용됩니다. 기록·배점 수정 후 저장해 주세요.</p>
            <span id="practicalEditStatus" role="status">변경사항 없음</span></div>
          <button type="button" class="btn btn-primary" id="savePracticalEdits" disabled>수정사항 저장</button>
        </div>
        <!-- 종목별 섹션 컨테이너 (JS 렌더) -->
        <div id="scoreSections" class="score-sections">
          <div class="empty-state-big">
            <i class="ph-light ph-table"></i>
            <h3>학교를 선택하고 <b>배점표 불러오기</b></h3>
          </div>
        </div>

        <!-- 편집 섹션 (한 줄 추가 · 대량 추가) -->
        <div class="editor-grid">
          <div class="editor-card">
            <div class="editor-head">
              <i class="ph-light ph-plus"></i>
              <h3>한 줄 추가</h3>
            </div>
            <form id="addForm" class="editor-body">
              <div class="field">
                <label for="eventName">종목명</label>
                <input type="text" id="eventName" placeholder="예: 좌전굴" autocomplete="off" required>
              </div>
              <div class="field">
                <label for="genderSel">성별</label>
                <div class="combobox no-search" id="genderSel" style="min-width:140px;"></div>
              </div>
              <div class="field">
                <label for="record">기록</label>
                <input type="text" id="record" placeholder="12.50 또는 A" autocomplete="off" required>
              </div>
              <div class="field">
                <label for="score">배점</label>
                <input type="text" id="score" placeholder="100 또는 PASS" autocomplete="off" required>
              </div>
              <div class="editor-actions">
                <button type="submit" class="btn btn-primary">
                  <i class="ph-light ph-floppy-disk"></i> 신규 저장
                </button>
              </div>
            </form>
          </div>

          <div class="editor-card">
            <div class="editor-head">
              <i class="ph-light ph-clipboard-text"></i>
              <h3>대량 추가 <span class="head-sub">엑셀/CSV 복붙</span></h3>
            </div>
            <div class="editor-body">
              <div class="field">
                <label for="bulkEventName">종목명</label>
                <input type="text" id="bulkEventName" placeholder="적용할 종목명" autocomplete="off">
              </div>
              <div class="field">
                <label for="bulkGenderSel">성별</label>
                <div class="combobox no-search" id="bulkGenderSel" style="min-width:140px;"></div>
              </div>
              <p class="note">엑셀의 <b>기록</b> 열 · <b>배점</b> 열을 각각 복사해서 아래 칸에 붙여넣으세요. 줄 수가 일치해야 합니다.</p>
              <div class="bulk-paste-area">
                <textarea id="bulkRecord" placeholder="[기록] 열 붙여넣기" spellcheck="false"></textarea>
                <textarea id="bulkScore" placeholder="[배점] 열 붙여넣기" spellcheck="false"></textarea>
              </div>
              <div class="editor-actions">
                <button type="button" class="btn btn-primary" id="bulkSaveButton">
                  <i class="ph-light ph-stack"></i> 대량 저장
                </button>
              </div>
            </div>
          </div>
        </div>

      </section>
    </div>
  </div>

  <!-- 공통 JS -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="assets/js/combobox.js"></script>
  <!-- 페이지 전용 -->
  <script src="assets/js/pages/practical-save.js?v=20260906"></script>
  <script src="assets/js/pages/practical-editor-table.js?v=20260906"></script>
  <script src="silgi-editor.js?v=20260906"></script>
</body>
</html>
