<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>등급컷 · 맥스정시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- 공통 자산 -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <link rel="stylesheet" href="scores_editor.css">
</head>
<body data-page="scores_editor" data-title="등급컷" data-category="관리자">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>관리자</span>
          <span class="sep">/</span>
          <span class="current">등급컷</span>
        </div>
        <div class="topbar-actions">
          <div class="year-select-wrap">
            <label for="year-selector">학년도</label>
            <select id="year-selector">
              <option value="2027">2027학년도</option>
              <option value="2026">2026학년도</option>
              <option value="2028">2028학년도</option>
            </select>
          </div>
          <button class="btn btn-ghost" id="load-btn">
            <i class="ph-light ph-download-simple"></i> 불러오기
          </button>
          <button class="btn btn-primary" id="save-btn">
            <i class="ph-light ph-floppy-disk"></i> 전체 저장
          </button>
        </div>
      </header>

      <section class="page-content">

        <!-- 안내 배너 -->
        <div class="hint-banner">
          <i class="ph-fill ph-ranking"></i>
          <span>엑셀에서 <b>1~9 등급 점수를 탭으로 구분된 한 행</b> 으로 복사(Ctrl+C) 후, 표의 시작 셀에 <b>붙여넣기(Ctrl+V)</b> 하면 아래 행까지 자동으로 채워집니다.</span>
        </div>

        <!-- 메시지 -->
        <div id="message-area" class="message hidden" role="status" aria-live="polite"></div>

        <!-- 테이블 카드들 -->
        <div class="tables-grid">

          <div class="table-card">
            <header class="card-head">
              <div class="card-title-group">
                <div class="card-icon accent"><i class="ph-light ph-translate"></i></div>
                <div>
                  <h2 class="card-title">영어 등급별 점수</h2>
                  <p class="card-sub">대학 · 학과별 1~9 등급 환산 점수</p>
                </div>
              </div>
            </header>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th class="col-univ">대학명</th>
                    <th class="col-dept">학과명</th>
                    <th class="col-grade">1</th>
                    <th class="col-grade">2</th>
                    <th class="col-grade">3</th>
                    <th class="col-grade">4</th>
                    <th class="col-grade">5</th>
                    <th class="col-grade">6</th>
                    <th class="col-grade">7</th>
                    <th class="col-grade">8</th>
                    <th class="col-grade">9</th>
                  </tr>
                </thead>
                <tbody id="english-tbody">
                  <tr><td colspan="11"><div class="empty-state"><i class="ph-light ph-circle-notch spin"></i><span>학년도를 선택해 불러오기</span></div></td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="table-card">
            <header class="card-head">
              <div class="card-title-group">
                <div class="card-icon warn"><i class="ph-light ph-book-open"></i></div>
                <div>
                  <h2 class="card-title">한국사 등급별 점수</h2>
                  <p class="card-sub">대학 · 학과별 1~9 등급 환산 점수</p>
                </div>
              </div>
            </header>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th class="col-univ">대학명</th>
                    <th class="col-dept">학과명</th>
                    <th class="col-grade">1</th>
                    <th class="col-grade">2</th>
                    <th class="col-grade">3</th>
                    <th class="col-grade">4</th>
                    <th class="col-grade">5</th>
                    <th class="col-grade">6</th>
                    <th class="col-grade">7</th>
                    <th class="col-grade">8</th>
                    <th class="col-grade">9</th>
                  </tr>
                </thead>
                <tbody id="history-tbody">
                  <tr><td colspan="11"><div class="empty-state"><i class="ph-light ph-circle-notch spin"></i><span>학년도를 선택해 불러오기</span></div></td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>

      </section>
    </div>
  </div>

  <!-- 공통 JS -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <!-- 페이지 전용 -->
  <script src="scores_editor.js"></script>
</body>
</html>
