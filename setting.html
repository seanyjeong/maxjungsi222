<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>환경 설정 · 맥스정시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- 공통 자산 -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <!-- 페이지 전용 -->
  <link rel="stylesheet" href="setting.css">
</head>
<body data-page="setting" data-title="환경 설정" data-category="관리자">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>관리자</span>
          <span class="sep">/</span>
          <span class="current">환경 설정</span>
        </div>
        <div class="topbar-actions">
          <div class="year-pill">
            <label for="year-selector"><i class="ph-light ph-calendar-blank"></i> 학년도</label>
            <select id="year-selector" class="select-native">
              <option value="2027">2027학년도</option>
              <option value="2026">2026학년도</option>
              <option value="2028">2028학년도</option>
            </select>
          </div>
        </div>
      </header>

      <section class="page-content">

        <!-- 헤더 카드 -->
        <div class="page-hero">
          <div class="hero-icon"><i class="ph-light ph-gear-six"></i></div>
          <div class="hero-body">
            <h1 class="hero-title">정시 선택반영 규칙 설정</h1>
            <p class="hero-sub">학교·학과별 계산 방식, 총점, 과목 유형, 선택 반영/가산점 규칙을 편집합니다.</p>
          </div>
        </div>

        <div class="layout">

          <!-- 좌측: 대학 목록 -->
          <aside class="list-col">
            <div class="card list-card">
              <div class="card-head">
                <h2 class="card-title"><i class="ph-light ph-buildings"></i> 대학 목록</h2>
              </div>

              <!-- 초성 필터 -->
              <div id="school-index" class="chip-row chip-row-initial"></div>

              <!-- 군 필터 -->
              <div id="gun-filter" class="chip-row chip-row-gun">
                <button class="chip-btn active" data-gun="전체">전체</button>
                <button class="chip-btn" data-gun="가군">가군</button>
                <button class="chip-btn" data-gun="나군">나군</button>
                <button class="chip-btn" data-gun="다군">다군</button>
                <button class="chip-btn" data-gun="기타">기타</button>
              </div>

              <ul id="school-list" class="school-list"></ul>
            </div>
          </aside>

          <!-- 우측: 에디터 -->
          <main class="edit-col">

            <!-- Welcome -->
            <div id="welcome-message" class="welcome-card">
              <div class="welcome-icon"><i class="ph-light ph-cursor-click"></i></div>
              <div class="welcome-body">
                <h3>학교를 선택하세요</h3>
                <p>상단에서 학년도를 선택하고, 왼쪽 목록에서 편집할 학과를 고르세요.</p>
              </div>
            </div>

            <!-- Rule editor -->
            <div id="rule-editor" class="rule-editor hidden">
              <div class="editor-head">
                <h2 id="editor-title" class="editor-title"></h2>
              </div>

              <!-- 계산 유형 -->
              <section class="section">
                <h3 class="section-title"><i class="ph-light ph-function"></i> 계산 유형</h3>
                <div class="form-group">
                  <label class="form-label">이 학과의 계산 방식을 선택하세요</label>
                  <select id="formula-type-select" class="select-native">
                    <option value="기본비율">기본 비율 계산 (대부분)</option>
                    <option value="특수공식">특수 공식 사용</option>
                  </select>
                  <div id="special-formula-wrapper" class="hidden special-wrap">
                    <label class="form-label" for="special-formula-text">특수 공식 내용</label>
                    <textarea id="special-formula-text" placeholder="이곳에 해당 학교만의 특수 계산식을 입력하세요..."></textarea>
                  </div>
                </div>
              </section>

              <div id="default-rules-wrapper">

                <!-- 전체 계산 방식 -->
                <section class="section">
                  <h3 class="section-title"><i class="ph-light ph-scales"></i> 전체 계산 방식</h3>
                  <div class="form-group">
                    <label class="form-label">이 학교의 전체 점수 계산 방식</label>
                    <div id="calc-method-buttons" class="pill-group">
                      <button class="pill-btn active" data-method="환산">환산 계산</button>
                      <button class="pill-btn" data-method="직접">직접 계산</button>
                    </div>
                  </div>
                </section>

                <!-- 총점 -->
                <section class="section">
                  <h3 class="section-title"><i class="ph-light ph-target"></i> 총점 (만점)</h3>
                  <div class="form-group">
                    <div class="inline-controls">
                      <div id="total-buttons" class="pill-group">
                        <button class="pill-btn active" data-value="1000">1000점</button>
                        <button class="pill-btn" data-value="500">500점</button>
                        <button class="pill-btn" data-value="300">300점</button>
                        <button class="pill-btn" data-value="custom">직접입력</button>
                      </div>
                      <label class="inline-input">
                        직접입력
                        <input type="number" id="total-custom" placeholder="예: 750" min="100" max="2000">
                      </label>
                    </div>
                    <p class="form-hint">학교마다 만점(총점)이 1000/500/300 등으로 다를 수 있습니다. 저장 시 DB에 고정됩니다.</p>
                  </div>
                </section>

                <!-- 과목별 점수 종류 -->
                <section class="section">
                  <h3 class="section-title"><i class="ph-light ph-list-numbers"></i> 과목별 점수 종류</h3>
                  <div id="score-config-container" class="form-grid">
                    <div class="form-row">
                      <label class="form-label">국어 / 수학</label>
                      <div class="inline-controls">
                        <select id="km-type" class="select-native">
                          <option value="백분위">백분위</option>
                          <option value="표준점수">표준점수</option>
                          <option value="등급">등급</option>
                        </select>
                        <select id="km-max-score-method" class="select-native hidden">
                          <option value="fixed_200">200점 만점 기준</option>
                          <option value="highest_of_year">당해 최고점 기준</option>
                        </select>
                      </div>
                    </div>

                    <div class="form-row">
                      <label class="form-label">영어</label>
                      <div class="inline-controls">
                        <select id="eng-type" class="select-native">
                          <option value="grade_conversion">등급별 환산점수 (DB)</option>
                          <option value="fixed_max_score">고정 만점 기준</option>
                        </select>
                        <div id="eng-max-score-buttons" class="pill-group hidden">
                          <button class="pill-btn" data-value="100">100점</button>
                          <button class="pill-btn" data-value="200">200점</button>
                        </div>
                      </div>
                    </div>

                    <div class="form-row">
                      <label class="form-label">탐구</label>
                      <div class="inline-controls">
                        <select id="inq-type" class="select-native">
                          <option value="백분위">백분위</option>
                          <option value="표준점수">표준점수</option>
                          <option value="변환표준점수">변환표준점수</option>
                          <option value="등급">등급</option>
                        </select>
                        <select id="inq-max-score-method" class="select-native hidden">
                          <option value="fixed_100">100점 만점 기준</option>
                          <option value="highest_of_year">당해 최고점 기준</option>
                        </select>
                      </div>
                    </div>
                  </div>
                </section>

                <!-- 기타 설정 -->
                <section class="section">
                  <h3 class="section-title"><i class="ph-light ph-sliders-horizontal"></i> 기타 설정</h3>
                  <div id="other-settings-container" class="form-group">
                    <label class="checkbox-row">
                      <input type="checkbox" id="chk-history-first">
                      <span>한국사 가산점 우선 적용 (가산점을 먼저 더한 후 수능 비율 환산)</span>
                    </label>
                  </div>
                </section>

                <!-- 선택 반영 규칙 -->
                <section class="section">
                  <h3 class="section-title"><i class="ph-light ph-check-square"></i> 선택 반영 규칙</h3>
                  <div id="rule-groups-container" class="rules-list"></div>
                  <div class="section-actions">
                    <button class="btn btn-ghost" id="add-rule-btn"><i class="ph-light ph-plus"></i> 선택 규칙 추가</button>
                    <button class="btn btn-ghost" id="set-default-btn"><i class="ph-light ph-arrow-counter-clockwise"></i> 기본 반영으로 설정</button>
                  </div>
                </section>

                <!-- 가산점 규칙 -->
                <section class="section">
                  <h3 class="section-title"><i class="ph-light ph-plus-circle"></i> 가산점 규칙</h3>
                  <div id="bonus-rules-container" class="rules-list"></div>
                  <div class="section-actions">
                    <button class="btn btn-ghost" id="add-bonus-rule-btn"><i class="ph-light ph-plus"></i> 가산점 규칙 추가</button>
                  </div>
                </section>
              </div>

              <!-- 저장 -->
              <div class="editor-footer">
                <button class="btn btn-primary btn-lg" id="save-btn">
                  <i class="ph-light ph-floppy-disk"></i> 모든 규칙 저장
                </button>
                <p id="editor-message" class="status-msg"></p>
              </div>
            </div>
          </main>

        </div>

      </section>
    </div>
  </div>

  <!-- 공통 JS -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <!-- 페이지 전용 -->
  <script src="setting.js"></script>
</body>
</html>
