<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>지원 현황 · 실기 일정 · 맥스정시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- 공통 자산 -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css?v=competition20260714">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <!-- 페이지 전용 -->
  <link rel="stylesheet" href="final_apply_list.css">
</head>
<body data-page="final_apply_list" data-title="본원 지원 현황" data-category="지원 수합">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>조회 · 상담</span>
          <span class="sep">/</span>
          <span class="current">지원 현황 · 실기 일정</span>
        </div>
        <div class="topbar-actions">
          <button class="filter-adv-btn" id="saveAllBtn" disabled>
            <i class="ph-light ph-floppy-disk"></i>
            변경 전체 저장
            <span class="count" id="dirtyCount" style="display:none">0</span>
          </button>
          <div class="combobox no-search topbar-combo" id="yearSel"></div>
        </div>
      </header>

      <section class="page-content">

        <!-- 요약 카운터 -->
        <div class="summary-row">
          <div class="summary-card accent">
            <div class="lbl">전체 지원</div>
            <div class="val" id="sumTotal">—</div>
            <div class="sub"><span id="sumYear">2027</span>학년도 정시</div>
          </div>
          <div class="summary-card">
            <div class="lbl">군별 분포</div>
            <div class="val" id="sumGun" style="font-size:16px">—</div>
            <div class="sub">가 · 나 · 다</div>
          </div>
          <div class="summary-card">
            <div class="lbl">일정 입력 완료</div>
            <div class="val" id="sumDone">—</div>
            <div class="sub" id="sumDoneSub">— %</div>
          </div>
          <div class="summary-card">
            <div class="lbl">미입력</div>
            <div class="val" id="sumPending">—</div>
            <div class="sub">실기 날짜 비어있음</div>
          </div>
        </div>

        <!-- 필터 바 -->
        <div class="filter-bar">
          <div class="gun-buttons" id="gunButtons">
            <button class="gun-btn active" data-gun="all">전체</button>
            <button class="gun-btn" data-gun="가">가군</button>
            <button class="gun-btn" data-gun="나">나군</button>
            <button class="gun-btn" data-gun="다">다군</button>
          </div>
          <div class="search-box">
            <i class="ph-light ph-magnifying-glass"></i>
            <input type="search" id="searchInput" placeholder="학생명, 대학, 학과 검색…">
          </div>
          <div class="combobox no-search sort-combo" id="sortSel"></div>
          <div class="result-count" id="resultCount">— / 총 —</div>
        </div>

        <!-- 테이블 -->
        <div class="apply-table-wrap">
          <table class="apply-table">
            <colgroup>
              <col style="width:120px">
              <col>
              <col style="width:60px">
              <col style="width:160px">
              <col style="width:120px">
              <col style="width:90px">
            </colgroup>
            <thead>
              <tr>
                <th>학생</th>
                <th>대학 / 학과</th>
                <th>군</th>
                <th>실기 날짜</th>
                <th>실기 시간</th>
                <th>저장</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="6"><div class="empty-state"><i class="ph-light ph-circle-notch spin"></i><h3>불러오는 중…</h3></div></td></tr>
            </tbody>
          </table>
        </div>

      </section>
    </div>
  </div>

  <!-- 공통 JS -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js?v=competition20260714"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="assets/js/combobox.js"></script>
  <!-- 페이지 전용 -->
  <script src="final_apply_list.js?v=competition20260714"></script>
</body>
</html>
