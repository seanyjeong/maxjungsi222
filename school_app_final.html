<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>맥스라이브 · 맥스정시</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <link rel="stylesheet" href="school_app_final.css">
</head>
<body data-page="school_app_final" data-title="맥스라이브" data-category="인사이트">
  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">
      <header class="topbar">
        <div class="page-path">
          <span>인사이트</span>
          <span class="sep">/</span>
          <span class="current">맥스라이브</span>
        </div>
        <div class="topbar-actions">
          <span class="live-chip">
            <span class="live-dot"></span>
            <i class="ph-fill ph-broadcast"></i>
            <strong>LIVE</strong>
          </span>
          <div class="combobox no-search topbar-combo" id="year-select" style="min-width:130px;"></div>
        </div>
      </header>

      <section class="page-content">

        <!-- 학과 선택 hero -->
        <div class="picker-card">
          <div class="picker-head">
            <div class="picker-label">
              <i class="ph-fill ph-broadcast"></i>
              <div>
                <div class="picker-title">학교별 <em>실제 지원자</em> 현황</div>
                <div class="picker-sub">원서 접수 이후 실제로 지원한 학생들을 전지점 실시간으로 집계합니다.</div>
              </div>
            </div>
          </div>

          <div class="cascade">
            <div class="cascade-step" data-step="1">
              <div class="step-badge">1</div>
              <label>군</label>
              <div class="combobox no-search" id="gun-select"></div>
            </div>
            <div class="cascade-step is-disabled" data-step="2">
              <div class="step-badge">2</div>
              <label>대학</label>
              <div class="combobox" id="university-select"></div>
            </div>
            <div class="cascade-step is-disabled" data-step="3">
              <div class="step-badge">3</div>
              <label>학과</label>
              <div class="combobox" id="department-select"></div>
            </div>
          </div>
        </div>

        <!-- 통계 strip -->
        <div class="stats-strip" id="statsStrip" hidden>
          <div class="stat-item">
            <span class="stat-label">모집인원</span>
            <span class="stat-value num" id="statQuota">—</span>
          </div>
          <div class="stat-item stat-primary">
            <span class="stat-label">총 지원자</span>
            <span class="stat-value num" id="statTotal">—</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">평균 수능</span>
            <span class="stat-value num" id="statAvgSuneung">—</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">수능 최고</span>
            <span class="stat-value num" id="statMaxSuneung">—</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">수능 최저</span>
            <span class="stat-value num" id="statMinSuneung">—</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">평균 총점</span>
            <span class="stat-value num" id="statAvgTotal">—</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">총점 최고</span>
            <span class="stat-value num" id="statMaxTotal">—</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">총점 최저</span>
            <span class="stat-value num" id="statMinTotal">—</span>
          </div>
          <div class="stat-sort">
            <span class="stat-label">정렬</span>
            <div class="combobox no-search" id="sort-select"></div>
          </div>
        </div>

        <!-- 지원자 grid -->
        <div class="applicants-card">
          <div class="applicants-head">
            <div class="applicants-title">
              <i class="ph-fill ph-broadcast"></i>
              <span>실제 지원자</span>
              <span class="dim" id="applicantsHint">학과를 선택하면 지원자가 표시됩니다</span>
              <span class="pass-stats" id="passStats" hidden></span>
            </div>
            <div class="applicants-legend" id="applicantsLegend" hidden>
              <span class="legend"><span class="dot dot-mine"></span>우리 지점</span>
              <span class="legend"><span class="dot dot-other"></span>타 지점</span>
            </div>
          </div>

          <div id="applicantsContainer">
            <div class="empty-state">
              <div class="empty-icon"><i class="ph-fill ph-broadcast"></i></div>
              <div class="empty-title">상단에서 군 / 대학을 선택하세요</div>
              <div class="empty-sub">원서 접수 이후 실제 지원한 학생들의 전지점 경쟁 상황을 실시간으로 확인합니다.</div>
            </div>
          </div>

          <div class="loading-state" id="loadingState" hidden>
            <i class="ph-light ph-circle-notch spin"></i>
            <span>불러오는 중…</span>
          </div>
        </div>

      </section>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="assets/js/combobox.js"></script>
  <script src="school_app_final.js"></script>
</body>
</html>
