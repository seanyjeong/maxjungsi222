<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>최고표점 대량 편집 · 맥스정시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- 공통 자산 -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <!-- 페이지 전용 -->
  <link rel="stylesheet" href="topmax_editor.css">
</head>
<body data-page="topmax_editor" data-title="최고표점 대량 편집" data-category="관리자">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>관리자</span>
          <span class="sep">/</span>
          <span class="current">최고표점 대량 편집</span>
        </div>
        <div class="topbar-actions"></div>
      </header>

      <section class="page-content">

        <!-- 헤더 카드 -->
        <div class="page-hero">
          <div class="hero-icon"><i class="ph-light ph-crown-simple"></i></div>
          <div class="hero-body">
            <h1 class="hero-title">최고표점 대량 편집</h1>
            <p class="hero-sub">학년도 · 모형별 과목 최고 표준점수를 한 번에 불러오고 저장합니다.</p>
          </div>
        </div>

        <!-- 컨트롤 바 -->
        <div class="control-bar">
          <div class="ctrl-group">
            <label class="ctrl-label" for="year">학년도</label>
            <select class="select-native" id="year">
              <option value="2027">2027</option>
              <option value="2026">2026</option>
              <option value="2028">2028</option>
            </select>
          </div>

          <div class="ctrl-group">
            <label class="ctrl-label" for="exam">모형</label>
            <select class="select-native" id="exam">
              <option value="수능">수능</option>
              <option value="9월">9월</option>
              <option value="6월">6월</option>
              <option value="3월">3월</option>
            </select>
          </div>

          <div class="ctrl-spacer"></div>

          <button class="btn btn-ghost" id="btnLoad">
            <i class="ph-light ph-arrow-clockwise"></i> 불러오기
          </button>
          <button class="btn btn-primary" id="btnSave">
            <i class="ph-light ph-floppy-disk"></i> 저장
          </button>
        </div>

        <!-- 힌트 배너 -->
        <div class="hint-banner">
          <i class="ph-light ph-lightbulb"></i>
          <span>엑셀에서 <b>1행에 과목 순서대로</b> 최고점을 붙여넣으면 자동 채움됩니다 (테이블 아무 셀에 붙여넣기).</span>
        </div>

        <!-- 편집 그리드 -->
        <div class="grid-wrap">
          <div class="grid-scroll">
            <table id="tbl" class="topmax-table">
              <thead><tr id="hdr"></tr></thead>
              <tbody><tr id="row"></tr></tbody>
            </table>
          </div>
        </div>

        <div id="msg" class="status-msg"></div>

      </section>
    </div>
  </div>

  <!-- 공통 JS -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="utils/examProfiles.js?v=20260903-3"></script>
  <!-- 페이지 전용 -->
  <script src="topmax_editor.js?v=20260903-3"></script>
</body>
</html>
