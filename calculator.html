<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>통합 계산기 · 맥스정시</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css?v=competition20260714">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <link rel="stylesheet" href="calculator.css">
</head>
<body data-page="calculator" data-title="통합 계산기" data-category="최종 지원">
  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">
      <header class="topbar">
        <div class="page-path">
          <span>최종 지원</span>
          <span class="sep">/</span>
          <span class="current">통합 계산기</span>
        </div>
        <div class="topbar-actions">
          <span class="branch-chip">
            <i class="ph-light ph-buildings"></i>
            <strong data-branch-name>—</strong>
          </span>
          <div class="combobox no-search topbar-combo" id="year-select" style="min-width:130px;"></div>
          <div class="combobox no-search topbar-combo" id="exam-select" style="min-width:120px;"></div>
        </div>
      </header>

      <section class="page-content">
        <!-- 학과 선택 hero -->
        <div class="picker-card" id="pickerCard">
          <div class="picker-head">
            <div class="picker-label">
              <i class="ph-light ph-target"></i>
              <div>
                <div class="picker-title">학과 선택</div>
                <div class="picker-sub">군 · 대학 · 학과를 차례로 지정하면 우리 지점 전체 학생의 환산 점수가 계산됩니다.</div>
              </div>
            </div>
            <div class="picker-meta" id="pickerMeta" hidden>
              <span class="meta-item"><i class="ph-light ph-users-three"></i><span id="metaStudentCount">—</span> 학생</span>
            </div>
          </div>

          <div class="cascade">
            <div class="cascade-step" data-step="1">
              <div class="step-badge">1</div>
              <label>군</label>
              <div class="combobox no-search" id="gun-select"></div>
            </div>
            <div class="cascade-arrow"><i class="ph-light ph-caret-right"></i></div>
            <div class="cascade-step is-disabled" data-step="2">
              <div class="step-badge">2</div>
              <label>대학</label>
              <div class="combobox uni-combo" id="universityCombo">
                <button type="button" class="combo-display" id="uniDisplay" disabled>
                  <span class="label placeholder" id="uniLabel">대학 선택</span>
                  <i class="ph-light ph-caret-down"></i>
                </button>
                <div class="combo-menu">
                  <div class="combo-search">
                    <i class="ph-light ph-magnifying-glass"></i>
                    <input type="search" id="uniSearch" placeholder="대학 검색…" autocomplete="off">
                  </div>
                  <div class="combo-list" id="uniList"></div>
                </div>
              </div>
            </div>
            <div class="cascade-arrow"><i class="ph-light ph-caret-right"></i></div>
            <div class="cascade-step is-disabled" data-step="3">
              <div class="step-badge">3</div>
              <label for="department-select">학과</label>
              <div class="combobox no-search" id="department-select"></div>
            </div>
          </div>
        </div>

        <!-- 학과 정보 strip (학과 선택 후) -->
        <div class="formula-strip" id="formulaStrip" hidden>
          <div class="formula-head">
            <div class="formula-uni">
              <span class="gun-pill" id="formulaGun">가</span>
              <strong id="formulaUniversity">—</strong>
              <span class="sep-dot">·</span>
              <span id="formulaDepartment">—</span>
              <div class="subject-ratios" id="subjectRatios"></div>
            </div>
            <div class="formula-cuts" id="formulaCuts" hidden>
              <div class="cut-row-mini cut-max-mini">
                <span class="cut-tag-mini"><i class="ph-fill ph-crown-simple"></i>맥스컷</span>
                <span class="cut-item-mini"><em>수능</em><em class="v" data-cut="max-suneung">—</em></span>
                <span class="cut-item-mini"><em>총점</em><em class="v" data-cut="max-total">—</em></span>
                <span class="cut-item-mini"><em>25</em><em class="v" data-cut="max-25">—</em></span>
                <span class="cut-item-mini"><em>26</em><em class="v" data-cut="max-26">—</em></span>
              </div>
              <div class="cut-row-mini cut-mine-mini">
                <span class="cut-tag-mini"><i class="ph-fill ph-map-pin"></i><span data-cut-mine-label>지점컷</span></span>
                <span class="cut-item-mini"><em>수능</em><em class="v" data-cut="mine-suneung">—</em></span>
                <span class="cut-item-mini"><em>총점</em><em class="v" data-cut="mine-total">—</em></span>
                <span class="cut-item-mini"><em>25</em><em class="v" data-cut="mine-25">—</em></span>
                <span class="cut-item-mini"><em>26</em><em class="v" data-cut="mine-26">—</em></span>
              </div>
            </div>
            <div class="formula-stats">
              <div class="stat" id="statQuotaWrap">
                <span class="stat-label">모집인원</span>
                <span class="stat-value num" id="statQuota">—</span>
              </div>
              <div class="stat" id="statSuneungWrap">
                <span class="stat-label">수능</span>
                <span class="stat-value num" id="statSuneung">—</span>
              </div>
              <div class="stat" id="statNaeshinWrap">
                <span class="stat-label">내신</span>
                <span class="stat-value num" id="statNaeshin">—</span>
              </div>
              <div class="stat" id="statSilgiWrap">
                <span class="stat-label">실기</span>
                <span class="stat-value num" id="statSilgi">—</span>
              </div>
              <div class="stat" id="statEtcWrap">
                <span class="stat-label">기타</span>
                <span class="stat-value num" id="statEtc">—</span>
              </div>
              <div class="stat stat-primary">
                <span class="stat-label">총점</span>
                <span class="stat-value num" id="statTotal">—</span>
              </div>
            </div>
          </div>
          <div class="previous-competition-card" data-competition-rate hidden
               aria-live="polite"></div>
        </div>

        <!-- 결과 테이블 -->
        <div class="results-card">
          <div class="results-head">
            <div class="results-title">
              <i class="ph-light ph-ranking"></i>
              <span>환산 결과</span>
              <span class="dim" id="resultCountHint">학과를 선택하면 결과가 표시됩니다</span>
            </div>
            <div class="results-legend" id="resultsLegend" hidden>
              <span class="legend"><span class="dot dot-suneung"></span>수능</span>
              <span class="legend" id="legendNaeshin" hidden><span class="dot dot-naeshin"></span>내신</span>
              <span class="legend"><span class="dot dot-silgi"></span>실기</span>
              <span class="legend"><span class="dot dot-total"></span>총점</span>
            </div>
          </div>

          <div class="table-wrap">
            <table id="results-table" class="results-table">
              <thead id="results-thead"></thead>
              <tbody id="results-tbody"></tbody>
            </table>

            <div class="empty-state" id="emptyState">
              <div class="empty-icon"><i class="ph-light ph-target"></i></div>
              <div class="empty-title">상단에서 군 / 대학 / 학과를 선택하세요</div>
              <div class="empty-sub">선택한 학과의 요강에 따라 우리 지점 전체 학생의 수능 환산 점수가 자동 계산됩니다.</div>
            </div>

            <div class="loading-state" id="loadingState" hidden></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- 학생 성적표 모달 -->
  <div class="modal-backdrop" id="studentScoresModal">
    <div class="modal-panel scores-modal">
      <header class="scores-modal-head">
        <div class="scores-head-main">
          <div class="scores-name-row" id="scoresModalName"></div>
          <div class="scores-chip-row" id="scoresModalMeta"></div>
        </div>
        <button class="scores-close-btn" data-close-modal="studentScoresModal" aria-label="닫기"><i class="ph-light ph-x"></i></button>
      </header>
      <div class="modal-body scores-modal-body" id="scoresModalBody"></div>
    </div>
  </div>

  <!-- 공통 자산 (host shell) -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js?v=competition20260714"></script>
  <script src="assets/js/competition-rate-observer.js?v=20260714"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="assets/js/combobox.js"></script>
  <script src="utils/examSchedule.js"></script>
  <script src="calculator.js"></script>
</body>
</html>
