<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>정시컷 편집 · 맥스정시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- 공통 자산 -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <link rel="stylesheet" href="cut_editor.css">
</head>
<body data-page="cut_editor" data-title="정시컷 편집" data-category="조회 · 상담">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>조회 · 상담</span>
          <span class="sep">/</span>
          <span class="current">정시컷 편집</span>
        </div>
        <div class="topbar-actions">
          <span class="role-pill" id="roleBadge"><i class="ph-light ph-user-circle"></i><strong id="roleLabel">—</strong></span>
          <div class="combobox no-search topbar-combo" id="pastCutSel" style="min-width:150px;"></div>
          <div class="combobox no-search topbar-combo" id="yearSel" style="min-width:130px;"></div>
          <button class="btn btn-primary" id="saveBtn" disabled>
            <i class="ph-light ph-floppy-disk"></i> 변경 저장
            <span class="count" id="dirtyCount" style="display:none">0</span>
          </button>
        </div>
      </header>

      <section class="page-content">

        <!-- 요약 카드 4장 -->
        <div class="summary-row">
          <div class="summary-card accent">
            <div class="lbl">전체 학과</div>
            <div class="val" id="sumTotal">—</div>
            <div class="sub"><span id="sumYear">2027</span>학년도 정시</div>
          </div>
          <div class="summary-card">
            <div class="lbl">군별 분포</div>
            <div class="val" id="sumGun" style="font-size:16px">—</div>
            <div class="sub">가 · 나 · 다</div>
          </div>
          <div class="summary-card">
            <div class="lbl">컷 입력 완료</div>
            <div class="val" id="sumDone">—</div>
            <div class="sub" id="sumDoneSub">— %</div>
          </div>
          <div class="summary-card">
            <div class="lbl">미입력</div>
            <div class="val" id="sumPending">—</div>
            <div class="sub" id="sumPendingSub">컷 비어있음</div>
          </div>
        </div>

        <!-- 안내 banner -->
        <div class="hint-banner" id="hintBanner">
          <i class="ph-fill ph-info"></i>
          <span id="hintText">지점 원장은 <b>지점 수능컷·총점컷</b>만 수정 가능합니다. 맥스컷·25년 컷은 본원 관리자만 수정합니다.</span>
        </div>

        <!-- 필터 바 -->
        <div class="filter-bar">
          <div class="gun-buttons" id="gunButtons">
            <button class="gun-btn active" data-gun="all">전체</button>
            <button class="gun-btn" data-gun="가">가군</button>
            <button class="gun-btn" data-gun="나">나군</button>
            <button class="gun-btn" data-gun="다">다군</button>
          </div>
          <div class="search-box">
            <i class="ph-light ph-magnifying-glass"></i>
            <input type="search" id="searchInput" placeholder="대학·학과 검색…">
          </div>
          <div class="result-count" id="resultCount">— / 총 —</div>
        </div>

        <!-- 컷 테이블 -->
        <div class="table-wrap">
          <table class="cut-table">
            <colgroup>
              <col style="width:260px">
              <col style="width:56px">
              <col style="width:60px"><col style="width:60px"><col style="width:60px">
              <col style="width:56px">
              <col style="width:104px"><col style="width:104px">
              <col style="width:104px"><col style="width:104px"><col style="width:104px">
            </colgroup>
            <thead>
              <tr>
                <th class="left">대학 / 학과</th>
                <th>군</th>
                <th>모집</th><th>수능</th><th>내신</th><th>실기</th>
                <th class="grp-branch">지점 수능컷</th>
                <th class="grp-branch">지점 총점컷</th>
                <th class="grp-max">맥스 수능컷</th>
                <th class="grp-max">맥스 총점컷</th>
                <th class="grp-max" id="thPastCut">25년 총점컷</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="10"><div class="empty-state"><i class="ph-light ph-circle-notch spin"></i><h3>불러오는 중…</h3></div></td></tr>
            </tbody>
          </table>
        </div>

      </section>
    </div>
  </div>

  <!-- 공통 JS -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="assets/js/combobox.js"></script>
  <!-- 페이지 전용 -->
  <script src="cut_editor.js"></script>
</body>
</html>
