<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>학생 추가 · 맥스정시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- 공통 자산 -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <!-- 페이지 전용 -->
  <link rel="stylesheet" href="add_student.css">
</head>
<body data-page="add_student" data-title="학생 추가" data-category="학생 · 성적">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>

    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>학생 · 성적</span>
          <span class="sep">/</span>
          <span class="current">학생 추가</span>
        </div>
        <div class="topbar-actions">
          <div class="combobox no-search topbar-combo" id="yearSel"></div>
        </div>
      </header>

      <section class="page-content">

        <!-- 요약 카운터 -->
        <div class="summary-row">
          <div class="summary-card accent">
            <div class="lbl">전체 학생</div>
            <div class="val" id="sumTotal">—</div>
            <div class="sub"><span id="sumYear">2027</span>학년도 · <span id="sumBranch">—</span></div>
          </div>
          <div class="summary-card">
            <div class="lbl">3학년</div>
            <div class="val" id="sumG3">—</div>
            <div class="sub">현역</div>
          </div>
          <div class="summary-card">
            <div class="lbl">N수생</div>
            <div class="val" id="sumGN">—</div>
            <div class="sub">재수 / 반수</div>
          </div>
          <div class="summary-card">
            <div class="lbl">2학년</div>
            <div class="val" id="sumG2">—</div>
            <div class="sub">예비 고3</div>
          </div>
        </div>

        <!-- 카드 1: 학생 추가 -->
        <article class="panel-card">
          <header class="panel-head">
            <div class="panel-title-group">
              <div class="panel-icon teal"><i class="ph ph-user-plus"></i></div>
              <div>
                <h2 class="panel-title">학생 추가</h2>
                <p class="panel-sub">한 명씩 또는 엑셀에서 여러 명 한 번에</p>
              </div>
            </div>
            <div class="panel-actions">
              <button class="btn btn-ghost" id="addRowBtn"><i class="ph-light ph-plus"></i> 행 추가</button>
              <button class="btn btn-primary" id="bulkAddBtn"><i class="ph-light ph-floppy-disk"></i> 명단 추가</button>
            </div>
          </header>

          <div class="hint-banner">
            <i class="ph-fill ph-info"></i>
            <span>엑셀이나 구글시트에서 <b>이름·학교·전화·구분·학년·성별</b> 여러 줄 복사 →
              첫 행 <b>이름</b> 칸에 붙여넣기 (<span id="pasteKey">Ctrl+V</span>) 하면 행이 자동으로 추가됩니다</span>
          </div>

          <div class="table-wrap">
            <table class="add-table">
              <colgroup>
                <col style="width:140px">
                <col>
                <col style="width:170px">
                <col style="width:120px">
                <col style="width:96px">
                <col style="width:96px">
                <col style="width:50px">
              </colgroup>
              <thead>
                <tr>
                  <th>이름</th><th>학교명</th><th>전화번호</th>
                  <th>구분</th><th>학년</th><th>성별</th><th></th>
                </tr>
              </thead>
              <tbody id="addTbody"></tbody>
            </table>
          </div>
        </article>

        <!-- 카드 2: 등록된 학생 목록 -->
        <article class="panel-card">
          <header class="panel-head">
            <div class="panel-title-group">
              <div class="panel-icon teal"><i class="ph ph-users"></i></div>
              <div>
                <h2 class="panel-title">등록된 학생</h2>
                <p class="panel-sub">이름 클릭으로 인라인 수정 · 삭제 시 관련 데이터 함께 삭제됨</p>
              </div>
            </div>
            <div class="panel-actions">
              <div class="search-box">
                <i class="ph-light ph-magnifying-glass"></i>
                <input type="search" id="searchInput" placeholder="이름·학교 검색…">
              </div>
              <div class="combobox no-search filter-combo" id="gradeFilter"></div>
              <span class="result-count" id="resultCount">— / 총 —</span>
            </div>
          </header>

          <div class="table-wrap">
            <table class="list-table">
              <colgroup>
                <col style="width:140px">
                <col>
                <col style="width:170px">
                <col style="width:96px">
                <col style="width:96px">
                <col style="width:80px">
                <col style="width:100px">
              </colgroup>
              <thead>
                <tr>
                  <th>이름</th><th>학교명</th><th>전화번호</th>
                  <th>구분</th><th>학년</th><th>성별</th><th>관리</th>
                </tr>
              </thead>
              <tbody id="listTbody">
                <tr><td colspan="7"><div class="empty-state"><i class="ph-light ph-circle-notch spin"></i><h3>불러오는 중…</h3></div></td></tr>
              </tbody>
            </table>
          </div>
        </article>

      </section>
    </div>
  </div>

  <!-- 공통 JS -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="assets/js/combobox.js"></script>
  <!-- 페이지 전용 -->
  <script src="add_student.js"></script>
</body>
</html>
