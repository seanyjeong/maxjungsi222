<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>맥스정시엔진 · 로그인</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <script>
    // FOUC 방지: 다크 테마 복원을 <head> 에서 즉시 실행
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
  </script>

  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      font-family: 'Pretendard', 'Geist', ui-sans-serif, system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 배경 워터마크 (전체) */
    .login-bg {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(15,118,110,0.08), transparent 50%),
        radial-gradient(circle at 85% 80%, rgba(234,88,12,0.06), transparent 50%);
      z-index: 0;
      pointer-events: none;
    }
    .login-watermark {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 60vw;
      max-width: 900px;
      aspect-ratio: 3 / 1;
      background-image: url('/assets/img/max-logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.04;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    /* 카드 */
    .login-card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-modal);
      padding: 36px 36px 28px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .login-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .login-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: var(--accent-soft);
      border: 1px solid #99f6e4;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-strong);
      letter-spacing: 0.04em;
      font-family: 'Geist Mono', monospace;
    }
    .login-brand i { font-size: 14px; }
    .login-title {
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-top: 4px;
    }
    .login-sub {
      font-size: 12.5px; color: var(--text-3);
      letter-spacing: -0.005em;
    }

    /* 폼 */
    .login-form {
      display: flex; flex-direction: column;
      gap: 10px;
    }
    .field {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface-2);
      border: 1px solid transparent;
      border-radius: var(--r-sm);
      padding: 11px 14px;
      transition: border-color 200ms var(--ease), background 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    .field:focus-within {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .field i { color: var(--text-3); font-size: 16px; flex-shrink: 0; }
    .field:focus-within i { color: var(--accent); }
    .field input {
      flex: 1;
      border: 0; outline: 0;
      background: transparent;
      font: inherit;
      font-size: 13.5px;
      color: var(--text);
      letter-spacing: -0.005em;
    }
    .field input::placeholder { color: var(--text-3); }

    .login-btn {
      margin-top: 6px;
      padding: 12px 16px;
      border: 0;
      border-radius: var(--r-sm);
      background: linear-gradient(135deg, var(--accent-strong), var(--accent));
      color: #fff;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: -0.005em;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform 150ms var(--ease), box-shadow 200ms var(--ease), opacity 200ms var(--ease);
      box-shadow: 0 4px 12px rgba(15,118,110,0.18);
      font-family: inherit;
    }
    .login-btn:hover { box-shadow: 0 6px 18px rgba(15,118,110,0.28); transform: translateY(-1px); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .login-btn i { font-size: 15px; }

    /* 메시지 */
    .login-msg {
      min-height: 18px;
      font-size: 12px;
      text-align: center;
      font-weight: 500;
      letter-spacing: -0.005em;
      padding: 2px 0;
    }
    .login-msg.success { color: var(--accent-strong); }
    .login-msg.error   { color: var(--danger); }
    .login-msg.info    { color: var(--text-2); }

    /* 푸터 */
    .login-foot {
      text-align: center;
      font-size: 10.5px;
      color: var(--text-3);
      font-family: 'Geist Mono', monospace;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-bg" aria-hidden="true"></div>
  <div class="login-watermark" aria-hidden="true"></div>

  <div class="login-card">
    <div class="login-head">
      <span class="login-brand"><i class="ph-fill ph-lightning"></i>맥스정시엔진</span>
      <div class="login-title">로그인</div>
      <div class="login-sub">학원 원장·관리자 전용</div>
    </div>

    <form class="login-form" id="loginForm" autocomplete="on">
      <div class="field">
        <i class="ph-light ph-user"></i>
        <input type="text" id="userid" placeholder="아이디" required autocomplete="username">
      </div>
      <div class="field">
        <i class="ph-light ph-lock-key"></i>
        <input type="password" id="password" placeholder="비밀번호" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        <i class="ph-light ph-sign-in"></i>
        <span id="loginBtnText">로그인</span>
      </button>
    </form>

    <p id="loginMsg" class="login-msg"></p>

    <div class="login-foot">v2.26.04 · maxjungsi</div>
  </div>

<script>
(function () {
  'use strict';

  const SVR = 'https://supermax.kr';
  const urlParams = new URLSearchParams(window.location.search);
  const redirectParam = urlParams.get('redirect');
  const REDIRECT = redirectParam || 'welcome.html';

  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');
  const btnText = document.getElementById('loginBtnText');
  const btnIcon = btn.querySelector('i');
  const msg = document.getElementById('loginMsg');
  const useridEl = document.getElementById('userid');

  // 이미 로그인되어 있으면 바로 redirect
  try {
    const existing = localStorage.getItem('jwt_token');
    if (existing) {
      // 토큰 형태만 대충 체크 (3 segments)
      if (existing.split('.').length === 3) {
        msg.textContent = '이미 로그인되어 있습니다. 이동 중…';
        msg.className = 'login-msg info';
        setTimeout(() => { window.location.href = REDIRECT; }, 600);
      }
    }
  } catch (e) { /* no-op */ }

  function setMsg(text, kind) {
    msg.textContent = text || '';
    msg.className = 'login-msg' + (kind ? ' ' + kind : '');
  }
  function setLoading(on) {
    btn.disabled = on;
    btnText.textContent = on ? '로그인 중…' : '로그인';
    btnIcon.className = on ? 'ph-light ph-circle-notch spin' : 'ph-light ph-sign-in';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const userid = useridEl.value.trim();
    const password = document.getElementById('password').value;
    if (!userid || !password) return;

    setLoading(true);
    setMsg('인증 요청 중…', 'info');

    try {
      const res = await fetch(SVR + '/susi/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userid, password }),
      });
      const data = await res.json().catch(() => ({}));

      if (data && data.success && data.token) {
        try { localStorage.setItem('jwt_token', data.token); }
        catch (_) {
          setMsg('토큰 저장 실패. 브라우저 저장소를 확인하세요.', 'error');
          setLoading(false);
          return;
        }
        setMsg('로그인 성공! 이동합니다…', 'success');
        setTimeout(() => { window.location.href = REDIRECT; }, 600);
      } else {
        setMsg((data && data.message) || '아이디 또는 비밀번호를 확인하세요.', 'error');
        setLoading(false);
      }
    } catch (err) {
      console.error('[login]', err);
      setMsg('로그인 서버에 연결할 수 없습니다.', 'error');
      setLoading(false);
    }
  });

  useridEl.focus();
})();
</script>
</body>
</html>
