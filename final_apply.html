<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>최종 지원 · 맥스정시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/topbar.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/combobox.css">
  <link rel="stylesheet" href="final_apply.css">
</head>
<body data-page="final_apply" data-title="최종 지원" data-category="최종 지원">

  <div class="app-shell" id="appShell">
    <div id="sidebar-slot"></div>
    <div class="main">

      <header class="topbar">
        <div class="page-path">
          <span>최종 지원</span>
          <span class="sep">/</span>
          <span class="current">수합</span>
        </div>
        <div class="topbar-actions">
          <div class="combobox no-search topbar-combo" id="year-cb" style="min-width:130px;"></div>
          <div class="combobox topbar-combo" id="student-cb" style="min-width:240px;"></div>
          <button id="save-btn" class="btn btn-primary save-btn" disabled>
            <i class="ph-light ph-floppy-disk"></i> 최종 지원 내역 저장
          </button>
        </div>
      </header>

      <section class="page-content">
        <div class="hero hidden" id="hero">
          <div class="avatar" id="hero-avatar">–</div>
          <div class="identity">
            <div class="name" id="hero-name">학생 이름</div>
            <div class="name-sub" id="hero-school">학교 정보</div>
          </div>
          <div class="meta">
            <span class="pill" id="hero-gender"><i class="ph ph-user"></i><span>성별</span></span>
            <span class="pill" id="hero-year"><i class="ph ph-calendar-blank"></i><span>2027학년도</span></span>
          </div>
          <div class="scores" id="hero-scores"></div>
        </div>

        <div class="empty-state" id="empty-state">
          <div class="icon-ring"><i class="ph ph-user-list"></i></div>
          <h3>지원 수합할 학생을 선택해 주세요</h3>
          <p>상단의 학생 콤보에서 대상 학생을 선택하면 가·나·다 3개 군별 지원 입력 카드가 표시됩니다.</p>
        </div>

        <div class="section-head hidden" id="section-head">
          <h2>가·나·다군 지원 내역</h2>
          <div class="hint"><i class="ph ph-info"></i><span>학과 미선택 시 저장하면 해당 군 정보는 삭제됩니다.</span></div>
        </div>

        <div class="gun-grid hidden" id="gun-grid"></div>
      </section>
    </div>
  </div>

  <!-- 공통 자산 -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/bootstrap.js"></script>
  <script src="assets/js/combobox.js"></script>
  <!-- 페이지 전용 헬퍼 (fmt2, safeParse, confirmDialog, convertScoresToSuneungFormat) -->
  <script>
    window.fmt2 = (n) => Number(n || 0).toFixed(2);
    window.safeParse = (s, fallback = null) => {
      if (typeof s === 'object' && s !== null) return s;
      if (typeof s !== 'string' || !s) return fallback;
      try { return JSON.parse(s); } catch (_) { return fallback; }
    };
    window.confirmDialog = (msg) => Promise.resolve(confirm(msg));
    window.convertScoresToSuneungFormat = (scores) => {
      if (!scores) return { subjects: [] };
      const subjects = [];
      if (scores.국어_표준점수 || scores.국어_백분위) subjects.push({ name: '국어', subject: scores.국어_선택과목, std: scores.국어_표준점수, percentile: scores.국어_백분위, grade: scores.국어_등급 });
      if (scores.수학_표준점수 || scores.수학_백분위) subjects.push({ name: '수학', subject: scores.수학_선택과목, std: scores.수학_표준점수, percentile: scores.수학_백분위, grade: scores.수학_등급 });
      if (scores.영어_등급) subjects.push({ name: '영어', grade: scores.영어_등급 });
      if (scores.한국사_등급) subjects.push({ name: '한국사', grade: scores.한국사_등급 });
      if (scores.탐구1_선택과목) subjects.push({ name: '탐구', subject: scores.탐구1_선택과목, std: scores.탐구1_표준점수, percentile: scores.탐구1_백분위, grade: scores.탐구1_등급 });
      if (scores.탐구2_선택과목) subjects.push({ name: '탐구', subject: scores.탐구2_선택과목, std: scores.탐구2_표준점수, percentile: scores.탐구2_백분위, grade: scores.탐구2_등급 });
      return { subjects };
    };
  </script>
  <script src="final_apply.js"></script>
</body>
</html>
